[project]
name = "rwanda-crop-price-predictor"
version = "1.0.0"
description = "Predicts the market price of farm produce in Rwanda from WFP market price data, served through FastAPI."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "scikit-learn==1.7.2",
    "pandas>=2.2",
    "numpy>=2.0",
    "joblib>=1.4",
]

[dependency-groups]
notebook = [
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
]
test = [
    "pytest>=8.3",
    "httpx>=0.27",
]
